[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tw-cdc-influenza-news-archive"
version = "0.1.0"
description = "Discoverable-news archiver for Taiwan CDC / influenza coverage (2023-2026)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<0.28",
    "trafilatura>=1.12,<2.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.2,<6.0",
    "pydantic>=2.7,<3.0",
    "python-dateutil>=2.9,<3.0",
    "tenacity>=8.3,<9.0",
    "typer>=0.12,<0.13",
    "rich>=13.7,<14.0",
    "PyYAML>=6.0,<7.0",
    "playwright>=1.44,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<0.24",
    "respx>=0.21,<0.22",
]

[project.scripts]
tw-cdc-influenza-news = "tw_cdc_influenza_news.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:tw_cdc_influenza_news.*"]
