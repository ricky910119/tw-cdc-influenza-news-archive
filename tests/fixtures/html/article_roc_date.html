  <main>
    <h1>疾管署公布流感疫情</h1>
    <p class="meta">發布日期：民國113年2月29日 15:30</p>
    <p>疾管署今日公布最新一週流感監測結果，門急診類流感就診人次持平，並無明顯上升趨勢。疾管署說明，農曆春節連假期間民眾就醫行為改變，數據需連續觀察兩週以上方能判斷疫情走向。</p>
    <p>疾管署另指出，國內流感併發重症病例以A型H1N1為主，與北半球流行株相符，現行疫苗具有保護力，呼籲尚未接種者把握機會。</p>
    <p>疾管署提醒，流感與一般感冒不同，症狀來得急且全身性症狀明顯，民眾如有疑慮應諮詢醫師，切勿自行判斷而延誤就醫時機。</p>
  </main>
