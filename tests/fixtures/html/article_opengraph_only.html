  <title>疾病管制署籲接種流感疫苗｜示範日報</title>
  <meta property="og:title" content="疾病管制署籲接種流感疫苗">

<body>
  <div class="article-body">
    <p>疾病管制署今天召開記者會，說明今年流感疫苗接種進度。疾管署指出，截至目前公費流感疫苗接種數已超過四百萬劑，較去年同期略增，顯示民眾接種意願提升。</p>
    <p>疾管署副署長表示，influenza 病毒於秋冬season活躍，呼籲六十五歲以上長者、幼兒及慢性病患者儘早完成接種，以降低重症與死亡風險。</p>
    <p>此外，疾管署也提醒醫療院所落實感染管制措施，並持續監測流感病毒株變異情形，必要時將滾動調整防疫策略與疫苗採購規劃。</p>
  </div>
